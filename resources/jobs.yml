resources:
  jobs:
    iothub_to_zerobus_autorun:
      name: iothub_to_zerobus_autorun_${bundle.target}
      max_concurrent_runs: 1
      timeout_seconds: 0
      queue:
        enabled: true
      # Continuous job: auto-restart after each available-now sweep completes.
      # Gives serverless-compatible "continuous" streaming without infinite-trigger errors.
      continuous:
        pause_status: UNPAUSED
      tasks:
        - task_key: bridge_iothub_to_zerobus
          timeout_seconds: 0
          spark_python_task:
            python_file: ../databricks/ingestion/iothub_to_zerobus_bridge_py.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --table
              - ${var.raw_input_table}
              - --workspace-url
              - ${var.zerobus_workspace_url}
              - --ingest-url
              - ${var.zerobus_ingest_url}
              - --sp-client-id-secret-scope
              - ${var.zerobus_secret_scope}
              - --sp-client-id-secret-key
              - ${var.zerobus_sp_client_id_key}
              - --sp-client-secret-secret-scope
              - ${var.zerobus_secret_scope}
              - --sp-client-secret-secret-key
              - ${var.zerobus_sp_client_secret_key}
              - --iothub-connection-secret-scope
              - ${var.zerobus_secret_scope}
              - --iothub-connection-secret-key
              - ${var.iothub_eventhubs_connection_secret_key}
              - --checkpoint-path
              - ${var.iothub_bridge_checkpoint_path}
              - --starting-offsets
              - ${var.iothub_bridge_starting_offsets}
              - --run-mode
              - ${var.iothub_bridge_run_mode}
              - --processing-time
              - ${var.iothub_bridge_processing_time}
              - --max-records-per-batch
              - ${var.iothub_bridge_max_records_per_batch}
              - --realtime-checkpoint-interval
              - ${var.iothub_bridge_realtime_checkpoint_interval}
          environment_key: bridge
      environments:
        - environment_key: bridge
          spec:
            environment_version: "4"
            dependencies:
              - databricks-zerobus-ingest-sdk
              - azure-eventhub
              - databricks-sdk

    iot_orchestration:
      name: iot_orchestration
      trigger:
        table_update:
          table_names:
            - ${var.catalog}.${var.schema}.silver_machine_telemetry
          condition: ALL_UPDATED
          min_time_between_triggers_seconds: 300
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: ML_Anomaly_Scoring
          spark_python_task:
            python_file: ../databricks/ml/ml_anomaly_notebook.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --inference-mode
              - batch
          environment_key: Default
        - task_key: ML_Fault_Prediction
          spark_python_task:
            python_file: ../databricks/ml/ml_state_prediction_notebook.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --inference-mode
              - batch
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED

    iot_lakebase_sync:
      name: iot_lakebase_sync
      trigger:
        table_update:
          table_names:
            - ${var.catalog}.${var.schema}.gold_machine_latest_status
          condition: ALL_UPDATED
          min_time_between_triggers_seconds: 61
          wait_after_last_change_seconds: 61
      max_concurrent_runs: 1
      tasks:
        - task_key: sync_to_lakebase
          spark_python_task:
            python_file: ../databricks/lakebase/lakebase_autoscaling_sync.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --lakebase-host
              - ${var.lakebase_host}
              - --lakebase-endpoint
              - ${var.lakebase_endpoint}
          environment_key: LakebaseSync
      queue:
        enabled: true
      environments:
        - environment_key: LakebaseSync
          spec:
            environment_version: "4"
            dependencies:
              - psycopg[binary]
      performance_target: PERFORMANCE_OPTIMIZED

    iot_views_and_dashboard:
      name: iot_views_and_dashboard
      schedule:
        quartz_cron_expression: "0 */2 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: Apply_Semantic_Views
          spark_python_task:
            python_file: ../databricks/semantic/apply_semantic_views.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --telemetry-live-window-hours
              - ${var.telemetry_live_window_hours}
          environment_key: Default
        - task_key: Create_refresh_metric_views
          depends_on:
            - task_key: Apply_Semantic_Views
          spark_python_task:
            python_file: ../databricks/semantic/create_uc_metric_views.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: Default
        - task_key: Refresh_Dashboard
          depends_on:
            - task_key: Create_refresh_metric_views
          dashboard_task:
            subscription: {}
            warehouse_id: ${var.sql_warehouse_id}
            dashboard_id: ${var.dashboard_id}
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED

