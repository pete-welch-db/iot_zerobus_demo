resources:
  jobs:
    iothub_to_zerobus_autorun:
      name: iothub_to_zerobus_autorun_${bundle.target}
      max_concurrent_runs: 1
      timeout_seconds: 0
      queue:
        enabled: true
      tasks:
        - task_key: bridge_iothub_to_zerobus
          timeout_seconds: 0
          max_retries: 5
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          spark_python_task:
            python_file: ../databricks/ingestion/iothub_to_zerobus_bridge.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --table
              - ${var.raw_input_table}
              - --workspace-url
              - ${var.zerobus_workspace_url}
              - --ingest-url
              - ${var.zerobus_ingest_url}
              - --sp-client-id-secret-scope
              - ${var.zerobus_secret_scope}
              - --sp-client-id-secret-key
              - ${var.zerobus_sp_client_id_key}
              - --sp-client-secret-secret-scope
              - ${var.zerobus_secret_scope}
              - --sp-client-secret-secret-key
              - ${var.zerobus_sp_client_secret_key}
              - --iothub-connection-secret-scope
              - ${var.zerobus_secret_scope}
              - --iothub-connection-secret-key
              - ${var.iothub_eventhubs_connection_secret_key}
              - --checkpoint-path
              - ${var.iothub_bridge_checkpoint_path}
              - --starting-offsets
              - ${var.iothub_bridge_starting_offsets}
              - --run-mode
              - ${var.iothub_bridge_run_mode}
              - --processing-time
              - ${var.iothub_bridge_processing_time}
              - --max-records-per-batch
              - ${var.iothub_bridge_max_records_per_batch}
              - --realtime-checkpoint-interval
              - ${var.iothub_bridge_realtime_checkpoint_interval}
          new_cluster:
            spark_version: 16.4.x-scala2.12
            node_type_id: Standard_D4ds_v5
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
              spark.databricks.streaming.realTimeMode.enabled: "true"
            custom_tags:
              ResourceClass: SingleNode
            azure_attributes:
              availability: ON_DEMAND_AZURE
              first_on_demand: 1
          libraries:
            - pypi:
                package: databricks-zerobus-ingest-sdk

    iot_orchestration:
      name: iot_orchestration
      tasks:
        - task_key: DLT_Pipeline_Continuous
          pipeline_task:
            pipeline_id: ${resources.pipelines.iot_telemetry_medallion.id}
            full_refresh: false
        - task_key: ML_Anomaly_Scoring
          depends_on:
            - task_key: DLT_Pipeline_Continuous
          spark_python_task:
            python_file: ../databricks/ml/ml_anomaly_notebook.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --inference-mode
              - batch
          environment_key: Default
        - task_key: ML_Fault_Prediction
          depends_on:
            - task_key: DLT_Pipeline_Continuous
          spark_python_task:
            python_file: ../databricks/ml/ml_state_prediction_notebook.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --inference-mode
              - batch
          environment_key: Default
        - task_key: Apply_Semantic_Views
          depends_on:
            - task_key: ML_Anomaly_Scoring
            - task_key: ML_Fault_Prediction
          spark_python_task:
            python_file: ../databricks/semantic/apply_semantic_views.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --telemetry-live-window-hours
              - ${var.telemetry_live_window_hours}
          environment_key: Default
        - task_key: Create_refresh_metric_views
          depends_on:
            - task_key: Apply_Semantic_Views
          spark_python_task:
            python_file: ../databricks/semantic/create_uc_metric_views.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: Default
        - task_key: Refresh_Dashboard
          depends_on:
            - task_key: Create_refresh_metric_views
          dashboard_task:
            subscription: {}
            warehouse_id: 148ccb90800933a1
            dashboard_id: 01f11755a5c31ce2ae7e3f1c7a514115
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED

    iot_lakebase_mirror_event_driven:
      name: IoT Lakebase OLTP Mirror (Event-Driven)
      description: |
        Exports vw_machine_current_status from Databricks to Lakebase PostgreSQL
        for operational applications (real-time dashboards, APIs, external systems).
      trigger:
        table_update:
          table_names:
            - ${var.catalog}.${var.schema}.silver_machine_telemetry
          condition: ANY_UPDATED
          min_time_between_triggers_seconds: 60
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      timeout_seconds: 300
      tasks:
        - task_key: mirror_to_lakebase_oltp
          spark_python_task:
            python_file: ../databricks/lakebase/lakebase_oltp_mirror.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --db-host
              - ${var.lakebase_db_host}
              - --db-port
              - ${var.lakebase_db_port}
              - --db-name
              - ${var.lakebase_db_name}
              - --lakebase-instance-name
              - ${var.lakebase_instance_id}
              - --instance-id
              - iot_demo_event_driven
              - --max-rows
              - "100000"
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_D4ds_v5
            num_workers: 0
            data_security_mode: USER_ISOLATION
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
              spark.driver.maxResultSize: 4g
              spark.sql.adaptive.enabled: "false"
            custom_tags:
              ResourceClass: SingleNode
            azure_attributes:
              availability: SPOT_WITH_FALLBACK_AZURE
              first_on_demand: 0
              spot_bid_max_price: -1
          libraries:
            - pypi:
                package: psycopg2-binary==2.9.9
            - pypi:
                package: requests
          timeout_seconds: 300
          max_retries: 3
          retry_on_timeout: true
          min_retry_interval_millis: 10000
      tags:
        environment: ${bundle.target}
        pipeline: iot_lakebase_export
        trigger_type: event_driven
        external_system: lakebase_oltp
        cost_center: manufacturing_ops

