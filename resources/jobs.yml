resources:
  jobs:
    iothub_to_zerobus_autorun:
      name: iothub_to_zerobus_autorun_${bundle.target}
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0/30 * * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: bridge_iothub_to_zerobus
          spark_python_task:
            python_file: ../databricks/iothub_to_zerobus_bridge.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --table
              - ${var.raw_input_table}
              - --workspace-url
              - ${var.zerobus_workspace_url}
              - --ingest-url
              - ${var.zerobus_ingest_url}
              - --sp-client-id-secret-scope
              - ${var.zerobus_secret_scope}
              - --sp-client-id-secret-key
              - ${var.zerobus_sp_client_id_key}
              - --sp-client-secret-secret-scope
              - ${var.zerobus_secret_scope}
              - --sp-client-secret-secret-key
              - ${var.zerobus_sp_client_secret_key}
              - --iothub-connection-secret-scope
              - ${var.zerobus_secret_scope}
              - --iothub-connection-secret-key
              - ${var.iothub_eventhubs_connection_secret_key}
              - --checkpoint-path
              - ${var.iothub_bridge_checkpoint_path}
              - --starting-offsets
              - ${var.iothub_bridge_starting_offsets}
          environment_key: zerobus
      environments:
        - environment_key: zerobus
          spec:
            environment_version: "2"
            dependencies:
              - databricks-zerobus-ingest-sdk

    iot_pipeline_keepalive:
      name: iot_pipeline_keepalive_${bundle.target}
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 */1 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: ensure_medallion_pipeline_running
          pipeline_task:
            pipeline_id: ${resources.pipelines.iot_telemetry_medallion.id}
            full_refresh: false

    iot_ml_realtime_scoring:
      name: iot_ml_realtime_scoring_${bundle.target}
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 */5 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: anomaly_realtime
          spark_python_task:
            python_file: ../databricks/ml_anomaly_notebook.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --mlflow-experiment
              - ${var.mlflow_experiment}
              - --inference-mode
              - realtime
              - --train-model
              - "false"
              - --realtime-lookback-minutes
              - "3"
          environment_key: default
        - task_key: fault_realtime
          depends_on:
            - task_key: anomaly_realtime
          spark_python_task:
            python_file: ../databricks/ml_state_prediction_notebook.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --mlflow-experiment
              - ${var.mlflow_experiment}
              - --inference-mode
              - realtime
              - --train-model
              - "false"
              - --realtime-lookback-minutes
              - "3"
          environment_key: default
        - task_key: refresh_semantic_views
          depends_on:
            - task_key: fault_realtime
          spark_python_task:
            python_file: ../databricks/apply_semantic_views.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: default
        - task_key: refresh_metric_views
          depends_on:
            - task_key: refresh_semantic_views
          spark_python_task:
            python_file: ../databricks/create_uc_metric_views.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - mlflow
              - scikit-learn

    iot_demo_realtime_workflow:
      name: iot_demo_realtime_workflow_${bundle.target}
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: preflight_checks
          spark_python_task:
            python_file: ../databricks/preflight_checks.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --raw-table
              - ${var.raw_input_table}
              - --secret-scope
              - ${var.zerobus_secret_scope}
              - --sp-client-id-key
              - ${var.zerobus_sp_client_id_key}
              - --sp-client-secret-key
              - ${var.zerobus_sp_client_secret_key}
              - --iothub-connection-key
              - ${var.iothub_eventhubs_connection_secret_key}
          environment_key: default

        - task_key: setup_zerobus_ingest
          depends_on:
            - task_key: preflight_checks
          spark_python_task:
            python_file: ../zerobus/ZEROBUS_INGEST_2026-03-03T15_04_07.404Z.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --table
              - ${var.raw_input_table}
              - --workspace-id
              - ${var.zerobus_workspace_id}
              - --workspace-url
              - ${var.zerobus_workspace_url}
              - --workspace-region
              - ${var.zerobus_workspace_region}
              - --ingest-url
              - ${var.zerobus_ingest_url}
              - --sp-client-id-secret-scope
              - ${var.zerobus_secret_scope}
              - --sp-client-id-secret-key
              - ${var.zerobus_sp_client_id_key}
              - --sp-client-secret-secret-scope
              - ${var.zerobus_secret_scope}
              - --sp-client-secret-secret-key
              - ${var.zerobus_sp_client_secret_key}
              - --run-smoke-ingest
              - ${var.zerobus_run_smoke_ingest}
          environment_key: zerobus

        - task_key: bridge_iothub_to_zerobus
          depends_on:
            - task_key: setup_zerobus_ingest
          spark_python_task:
            python_file: ../databricks/iothub_to_zerobus_bridge.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --table
              - ${var.raw_input_table}
              - --workspace-url
              - ${var.zerobus_workspace_url}
              - --ingest-url
              - ${var.zerobus_ingest_url}
              - --sp-client-id-secret-scope
              - ${var.zerobus_secret_scope}
              - --sp-client-id-secret-key
              - ${var.zerobus_sp_client_id_key}
              - --sp-client-secret-secret-scope
              - ${var.zerobus_secret_scope}
              - --sp-client-secret-secret-key
              - ${var.zerobus_sp_client_secret_key}
              - --iothub-connection-secret-scope
              - ${var.zerobus_secret_scope}
              - --iothub-connection-secret-key
              - ${var.iothub_eventhubs_connection_secret_key}
              - --checkpoint-path
              - ${var.iothub_bridge_checkpoint_path}
              - --starting-offsets
              - ${var.iothub_bridge_starting_offsets}
          environment_key: zerobus

        - task_key: update_medallion_pipeline
          depends_on:
            - task_key: bridge_iothub_to_zerobus
          pipeline_task:
            pipeline_id: ${resources.pipelines.iot_telemetry_medallion.id}
            full_refresh: false

        - task_key: anomaly_scoring
          depends_on:
            - task_key: update_medallion_pipeline
          spark_python_task:
            python_file: ../databricks/ml_anomaly_notebook.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --mlflow-experiment
              - ${var.mlflow_experiment}
              - --inference-mode
              - both
              - --train-model
              - "true"
          environment_key: default

        - task_key: fault_prediction
          depends_on:
            - task_key: anomaly_scoring
          spark_python_task:
            python_file: ../databricks/ml_state_prediction_notebook.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --mlflow-experiment
              - ${var.mlflow_experiment}
              - --inference-mode
              - both
              - --train-model
              - "true"
          environment_key: default

        - task_key: refresh_semantic_views
          depends_on:
            - task_key: fault_prediction
          spark_python_task:
            python_file: ../databricks/apply_semantic_views.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: default

        - task_key: refresh_metric_views
          depends_on:
            - task_key: refresh_semantic_views
          spark_python_task:
            python_file: ../databricks/create_uc_metric_views.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: default

        - task_key: validate_outputs
          depends_on:
            - task_key: refresh_metric_views
            - task_key: refresh_genie_space
          spark_python_task:
            python_file: ../databricks/validate_demo_outputs.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: default

        - task_key: refresh_genie_space
          depends_on:
            - task_key: refresh_metric_views
          spark_python_task:
            python_file: ../databricks/deploy_genie_space.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --warehouse-id
              - ${var.sql_warehouse_id}
              - --space-name
              - ${var.genie_space_name}
              - --genie-space-id
              - ${var.genie_space_id}
          environment_key: default
      environments:
        - environment_key: zerobus
          spec:
            environment_version: "2"
            dependencies:
              - databricks-zerobus-ingest-sdk
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - mlflow
              - scikit-learn
              - databricks-sdk
              - requests
