resources:
  pipelines:
    iot_telemetry_medallion:
      name: "[${bundle.target} ${workspace.current_user.short_name}] iot_telemetry_medallion_${bundle.target}"
      target: iot_demo_${bundle.target}
      catalog: welch
      edition: ADVANCED
      serverless: true
      continuous: true
      development: false
      channel: CURRENT
      photon: true
      libraries:
        - file:
            path: ../databricks/pipelines/dlt_pipeline.py
      configuration:
        iot.catalog: welch
        iot.schema: iot_demo_${bundle.target}
        iot.raw_input_table: ${var.catalog}.${var.schema}.${var.raw_input_table}
        iot.target_throughput_cpm: "100"
        spark.databricks.delta.optimizeWrite.enabled: "true"
        spark.databricks.delta.autoCompact.enabled: "true"
        pipelines.trigger.interval: "1 second"
