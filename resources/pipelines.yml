resources:
  pipelines:
    iot_telemetry_medallion:
      name: "[${bundle.target} ${workspace.current_user.short_name}] iot_telemetry_medallion_${bundle.target}"
      target: ${var.schema}
      catalog: ${var.catalog}
      edition: ADVANCED
      serverless: true
      continuous: true
      development: false
      channel: CURRENT
      photon: true
      libraries:
        - file:
            path: ../databricks/pipelines/dlt_pipeline.py
      configuration:
        iot.catalog: ${var.catalog}
        iot.schema: ${var.schema}
        iot.raw_input_table: ${var.catalog}.${var.schema}.${var.raw_input_table}
        iot.target_throughput_cpm: "100"
        spark.databricks.delta.optimizeWrite.enabled: "true"
        spark.databricks.delta.autoCompact.enabled: "true"
        pipelines.trigger.interval: "1 second"
