resources:
  pipelines:
    iot_telemetry_medallion:
      name: iot_telemetry_medallion_${bundle.target}
      target: ${var.schema}
      catalog: ${var.catalog}
      serverless: true
      continuous: true
      development: true
      channel: CURRENT
      photon: true
      libraries:
        - file:
            path: ../databricks/dlt_pipeline.py
      configuration:
        iot.catalog: ${var.catalog}
        iot.schema: ${var.schema}
        iot.raw_input_table: ${var.catalog}.${var.schema}.${var.raw_input_table}
        iot.target_throughput_cpm: ${var.target_throughput_cpm}
