bundle:
  name: iot_zerobus_demo

include:
  - resources/pipelines.yml
  - resources/jobs.yml
  # - resources/apps.yml  # temporarily excluded — app was deleted from workspace

variables:
  catalog:
    description: Unity Catalog name
    default: welch
  schema:
    description: Unity Catalog schema name
    default: iot_demo
  raw_input_table:
    description: Bronze table written by Zerobus bridge (typed telemetry + raw JSON + timestamps)
    default: bronze_iot_telemetry
  target_throughput_cpm:
    description: Throughput target for performance KPI
    default: "100"
  mlflow_experiment:
    description: MLflow experiment path
    default: /Shared/iot_zerobus_demo
  sql_warehouse_id:
    description: SQL warehouse ID used by AI/BI and Genie assets
    default: "148ccb90800933a1"
  genie_space_name:
    description: Display name for Genie space
    default: Manufacturing Command Center
  genie_space_id:
    description: Optional existing Genie space ID to force update
    default: "__AUTO__"
  zerobus_workspace_id:
    description: Databricks workspace ID for Zerobus endpoint derivation
    default: "984752964297111"
  zerobus_workspace_url:
    description: Databricks workspace URL used by Zerobus SDK
    default: https://adb-984752964297111.11.azuredatabricks.net
  zerobus_workspace_region:
    description: Workspace region used for endpoint derivation if ingest URL is not provided
    default: eastus2
  zerobus_ingest_url:
    description: Optional explicit Zerobus ingest URL (overrides workspace_id/region derivation when set)
    default: https://984752964297111.zerobus.eastus2.azuredatabricks.net
  zerobus_secret_scope:
    description: Secret scope containing service principal credentials
    default: iot_zerobus_demo
  zerobus_sp_client_id_key:
    description: Secret key name for service principal client id
    default: zerobus_sp_client_id
  zerobus_sp_client_secret_key:
    description: Secret key name for service principal client secret
    default: zerobus_sp_client_secret
  iothub_eventhubs_connection_secret_key:
    description: Secret key name holding IoT Hub Event Hubs-compatible connection string
    default: iothub_eventhubs_connection_string
  iothub_bridge_checkpoint_path:
    description: Checkpoint location for IoT Hub to Zerobus bridge streaming job
    default: dbfs:/checkpoints/iothub-zerobus
  iothub_bridge_starting_offsets:
    description: Kafka/Event Hubs starting offsets mode for IoT Hub bridge (latest for live demo, earliest for backfill)
    default: latest
  iothub_bridge_run_mode:
    description: Bridge streaming run mode (continuous for demo/prod, available-now for backfill)
    default: continuous
  iothub_bridge_processing_time:
    description: Processing trigger interval for continuous IoT Hub bridge micro-batches
    default: "1 second"
  iothub_bridge_max_records_per_batch:
    description: Max records processed per micro-batch to avoid OOM and smooth retries
    default: "5000"
  iothub_bridge_realtime_checkpoint_interval:
    description: Checkpoint frequency for realTime trigger in continuous mode
    default: "5 minutes"
  iothub_bridge_backfill_run_mode:
    description: Explicit one-shot bridge mode for workflow backfill/sweep path
    default: available-now
  iothub_bridge_backfill_starting_offsets:
    description: Starting offsets for explicit backfill sweep path
    default: latest
  dashboard_mode:
    description: Dashboard cadence mode (demo or steady)
    default: demo
  telemetry_live_window_hours:
    description: Rolling telemetry window used by vw_machine_telemetry_live
    default: "24"
  lakebase_project_id:
    description: Autoscaling Lakebase project identifier
    default: iot-demo-lakebase
  lakebase_resource_name:
    description: Friendly autoscaling Lakebase resource name
    default: iot-demo-lakebase
  lakebase_db_host:
    description: Lakebase endpoint host captured by provisioning
    default: "instance-d5f031cb-a61c-42d6-ac0a-c1c36d1f54dd.database.azuredatabricks.net"
  lakebase_db_port:
    description: Lakebase database port
    default: "5432"
  lakebase_db_name:
    description: Lakebase logical database used for OLTP mirror
    default: iot_demo
  lakebase_secret_scope:
    description: Secret scope containing Lakebase DB credentials
    default: iot_zerobus_demo
  lakebase_user_secret_key:
    description: Secret key name for Lakebase DB username
    default: lakebase_db_user
  lakebase_password_secret_key:
    description: Secret key name for Lakebase DB password
    default: lakebase_db_password
  lakebase_instance_id:
    description: Lakebase instance identifier (captured during provisioning)
    default: "iot-demo-lakebase"
  lakebase_jdbc_url:
    description: JDBC URL for Lakebase OLTP mirror job
    default: ""
  zerobus_run_smoke_ingest:
    description: Whether zerobus setup job writes a single test record
    default: "false"
  app_title:
    description: Streamlit app title
    default: IoT Manufacturing Flow Break Command Center
  dashboard_id:
    description: AI/BI dashboard ID for refresh task and embed URL
    default: "01f11755a5c31ce2ae7e3f1c7a514115"
  app_dashboard_url:
    description: Published AI/BI dashboard URL for app embed
    default: https://adb-984752964297111.11.azuredatabricks.net/embed/dashboardsv3/01f11755a5c31ce2ae7e3f1c7a514115?o=984752964297111
  app_genie_space_id:
    description: Genie space id for native app chat
    default: "01f117215c6112179fbec6269981f89b"

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: welch
      schema: iot_demo_dev
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: welch
      schema: iot_demo
